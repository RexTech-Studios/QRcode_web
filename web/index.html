<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Share your feedback">

  <!--
    Responsive viewport. viewport-fit=cover lets the page extend under the
    iOS notch / home indicator so env(safe-area-inset-*) works; the Flutter
    UI already keeps interactive content inside SafeArea.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#087A43">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Review">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Leave a Review</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F5F8F7;
      /* Avoid horizontal scrolling / rubber-banding on mobile. */
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
